<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Repo File Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* -- carried over from Cookie Vault, kept identical on purpose -- */
    --bg:#fdfbf7;
    --paper:#fffdf9;
    --paper-sunken:#faf5ec;
    --ink:#3a352e;
    --ink-soft:#5a5346;
    --muted:#8a8071;
    --line:#e6dcc9;
    --line-soft:#f0e9dd;
    --accent:#f0a04b;
    --accent-dark:#d4842f;
    --accent-wash:#f0a04b14;
    --accent-wash-strong:#f0a04b26;
    --green:#5fa876;
    --green-bg:#eef6f0;
    --coral:#e0654f;
    --coral-bg:#fbeeec;
    --blue:#3b6bc9;
    --mono:'Space Mono',ui-monospace,Consolas,monospace;
    --sans:'Inter',-apple-system,sans-serif;
    --sans-bn:'Noto Sans Bengali','Inter',-apple-system,sans-serif;

    --fs-xs: 0.72rem;
    --fs-sm: 0.85rem;
    --fs-base: 1rem;
    --fs-md: 1.15rem;
    --fs-lg: 1.5rem;

    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-5: 24px;
    --sp-6: 32px;

    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 22px;
    --shadow-card: 0 2px 0 var(--line);
    --shadow-float: 0 20px 44px -18px rgba(120,95,55,.35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans-bn);
    font-size: var(--fs-base);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-wash-strong); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  code, .mono { font-family: var(--mono); }

  /* ---------- login ---------- */
  #login {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--sp-5);
  }
  .login-card {
    width: 100%;
    max-width: 360px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-float);
    padding: var(--sp-6) var(--sp-5);
    text-align: center;
  }
  .login-mark {
    width: 44px; height: 44px;
    margin: 0 auto var(--sp-4);
    border-radius: var(--radius-sm);
    background: var(--accent-wash-strong);
    color: var(--accent-dark);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-weight: 700; font-size: var(--fs-md);
  }
  #login h1 { font-size: var(--fs-md); font-weight: 700; margin: 0 0 6px; }
  #login p.sub { color: var(--muted); margin: 0 0 var(--sp-5); font-size: var(--fs-sm); }
  #login input {
    width: 100%;
    padding: 11px 13px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--paper-sunken);
    color: var(--ink);
    font-size: var(--fs-base);
    font-family: var(--sans-bn);
  }
  #login input:focus { border-color: var(--accent); }
  #login .field { margin-bottom: var(--sp-3); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    background: var(--ink);
    color: var(--paper);
    font-weight: 700;
    font-size: var(--fs-sm);
    font-family: var(--sans-bn);
    cursor: pointer;
    transition: filter .15s ease, transform .05s ease;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; filter:none; }
  .btn.accent { background: var(--accent); color: #3a2708; }
  .btn.secondary {
    background: transparent;
    color: var(--ink);
    border-color: var(--line);
    font-weight: 600;
  }
  .btn.secondary:hover { background: var(--paper-sunken); filter: none; }
  .btn.danger { background: var(--coral-bg); color: var(--coral); border-color: var(--coral); }
  .btn.block { width: 100%; }

  #login .error {
    color: var(--coral);
    font-size: var(--fs-xs);
    min-height: 16px;
    margin-top: var(--sp-3);
  }
  #login .lockout {
    color: var(--coral);
    background: var(--coral-bg);
    border: 1px solid var(--coral);
    border-radius: var(--radius-sm);
    padding: var(--sp-2) var(--sp-3);
    font-size: var(--fs-xs);
    margin-top: var(--sp-3);
  }

  /* ---------- app shell ---------- */
  #app { display: none; height: 100vh; flex-direction: column; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--sp-3) var(--sp-5);
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  header .brand { display: flex; align-items: center; gap: 10px; }
  header .brand .mark {
    width: 26px; height: 26px;
    border-radius: 7px;
    background: var(--accent-wash-strong);
    color: var(--accent-dark);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-weight: 700; font-size: 12px;
  }
  header .repo {
    font-family: var(--mono);
    font-size: var(--fs-xs);
    color: var(--muted);
    background: var(--paper-sunken);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 12px;
  }
  header .repo b { color: var(--ink); font-weight: 700; }

  main { flex: 1; display: flex; overflow: hidden; }
  .pane { overflow-y: auto; padding: var(--sp-5); }
  #treePane { width: 46%; border-right: 1px solid var(--line); }
  #stagePane { width: 54%; display: flex; flex-direction: column; }
  #stageScroll { flex: 1; overflow-y: auto; padding: var(--sp-5); }

  h2 {
    font-size: var(--fs-xs);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 var(--sp-3);
    font-weight: 700;
    font-family: var(--sans);
  }
  .toolbar { display: flex; gap: 8px; margin-bottom: var(--sp-3); }
  .toolbar input[type="text"] {
    flex: 1;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--paper-sunken);
    color: var(--ink);
    font-size: var(--fs-sm);
    font-family: var(--sans-bn);
  }
  .toolbar input[type="text"]:focus { border-color: var(--accent); }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: var(--radius-sm);
    font-family: var(--mono);
    font-size: 12.5px;
    border: 1px solid transparent;
  }
  .row:hover { background: var(--paper-sunken); border-color: var(--line); }
  .row .path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .size { color: var(--muted); font-size: 11px; }
  .row input[type="checkbox"] { accent-color: var(--accent-dark); }
  .row input[type="text"].rename {
    flex: 1;
    background: var(--paper);
    border: 1px solid var(--accent);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 12.5px;
    padding: 4px 7px;
    border-radius: 6px;
  }
  .row .rename-btn {
    color: var(--accent-dark);
    cursor: pointer;
    font-size: 11px;
    font-weight: 700;
  }
  .row .rename-btn:hover { text-decoration: underline; }

  #dropzone {
    margin-top: var(--sp-5);
    border: 1.5px dashed var(--line);
    border-radius: var(--radius-md);
    padding: var(--sp-5) var(--sp-4);
    text-align: center;
    color: var(--muted);
    font-size: var(--fs-sm);
    cursor: pointer;
    background: var(--paper-sunken);
  }
  #dropzone.drag { border-color: var(--accent); color: var(--ink); background: var(--accent-wash); }
  #fileInput { display: none; }

  .diffRow {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 12.5px;
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    margin-bottom: 4px;
    border: 1px solid transparent;
  }
  .diffRow.add { background: var(--green-bg); border-color: #cfe8d6; }
  .diffRow.del { background: var(--coral-bg); border-color: #f3d3cd; }
  .diffRow .mark { width: 14px; font-weight: 700; }
  .diffRow.add .mark { color: var(--green); }
  .diffRow.del .mark { color: var(--coral); }
  .diffRow .path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .diffRow .remove { color: var(--muted); cursor: pointer; font-size: 14px; padding: 0 4px; }
  .diffRow .remove:hover { color: var(--ink); }

  .empty {
    color: var(--muted);
    font-size: var(--fs-sm);
    padding: var(--sp-3) 2px;
    font-family: var(--sans-bn);
  }

  #commitBar {
    border-top: 1px solid var(--line);
    padding: var(--sp-4);
    background: var(--paper);
    display: flex;
    gap: 10px;
  }
  #commitMsg {
    flex: 1;
    padding: 10px 13px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--paper-sunken);
    color: var(--ink);
    font-size: var(--fs-sm);
    font-family: var(--sans-bn);
  }
  #commitMsg:focus { border-color: var(--accent); }

  #status { position: fixed; bottom: 16px; right: 16px; max-width: 360px; z-index: 50; }
  .toast {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 11px 14px;
    font-size: var(--fs-sm);
    margin-top: 8px;
    box-shadow: var(--shadow-float);
    font-family: var(--sans-bn);
  }
  .toast.err { border-color: var(--coral); color: var(--coral); }
  .toast.ok { border-color: var(--green); color: var(--green); }
  .toast a { color: inherit; text-decoration: underline; }

  @media (max-width: 760px) {
    main { flex-direction: column; overflow-y: auto; }
    #treePane, #stagePane { width: 100%; border-right: 0; border-bottom: 1px solid var(--line); }
    #app { height: auto; min-height: 100vh; }
  }
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="login-mark">RF</div>
    <h1>Repo File Manager</h1>
    <p class="sub">Cloudflare Worker-এ সেট করা অ্যাক্সেস পাসওয়ার্ড দাও</p>
    <div class="field">
      <input id="pw" type="password" placeholder="Access password" autofocus autocomplete="current-password" />
    </div>
    <button id="loginBtn" class="btn accent block">ঢোকো</button>
    <div class="error" id="loginErr"></div>
    <div class="lockout" id="loginLockout" style="display:none;"></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="brand">
      <div class="mark">RF</div>
      <div class="repo">repo: <b id="repoName">—</b> · branch: <b id="branchName">—</b></div>
    </div>
    <button class="btn secondary" id="logoutBtn">Sign out</button>
  </header>
  <main>
    <section class="pane" id="treePane">
      <h2>Repository files</h2>
      <div class="toolbar">
        <input type="text" id="search" placeholder="ফিল্টার করো (পাথ দিয়ে)..." />
        <button class="btn danger" id="deleteSelectedBtn">Delete selected</button>
      </div>
      <div id="treeList"></div>

      <div id="dropzone">
        একটা zip ফাইল ড্রপ করো (ভেতরের ফাইলগুলো এক্সট্র্যাক্ট হয়ে লিস্টে আসবে, সিলেক্ট করে অ্যাড করতে পারবে)
        — অথবা যেকোনো ফাইল সরাসরি ড্রপ করো
        <input type="file" id="fileInput" multiple />
      </div>
    </section>

    <section class="pane" id="stagePane">
      <div id="stageScroll">
        <h2>Staged changes</h2>
        <div id="stageList"><div class="empty">কিছু এখনো স্টেজ করা হয়নি</div></div>
      </div>
      <div id="commitBar">
        <input type="text" id="commitMsg" placeholder="Commit message" />
        <button class="btn accent" id="commitBtn">Commit</button>
      </div>
    </section>
  </main>
</div>

<div id="status"></div>

<script type="module">
import { unzipSync, strToU8 } from "https://cdn.jsdelivr.net/npm/fflate@0.8.2/+esm";

const $ = (id) => document.getElementById(id);
let PW = sessionStorage.getItem("gfm_pw") || "";
let tree = [];           // current repo files: [{path, sha, size}]
let staged = { add: new Map(), del: new Set() }; // add: path -> {content?,sha?,encoding}, del: set of paths

// --- client-side lockout: slows down repeated wrong-password guesses.
// This is a UX speed bump only, not real security (a script hitting the
// Worker directly can ignore it). Real brute-force protection has to live
// on the Worker itself — see README for the rate-limit note.
const LOCK_KEY = "gfm_lock";
function getLockState() {
  try { return JSON.parse(localStorage.getItem(LOCK_KEY) || "null") || { fails: 0, until: 0 }; }
  catch { return { fails: 0, until: 0 }; }
}
function setLockState(s) { localStorage.setItem(LOCK_KEY, JSON.stringify(s)); }
function registerFailedAttempt() {
  const s = getLockState();
  s.fails += 1;
  if (s.fails >= 3) {
    const delaySeconds = Math.min(30 * 2 ** (s.fails - 3), 300); // 30s, 60s, 120s, ... cap 5min
    s.until = Date.now() + delaySeconds * 1000;
  }
  setLockState(s);
  return s;
}
function clearLockState() { setLockState({ fails: 0, until: 0 }); }
function lockRemainingMs() { return Math.max(0, getLockState().until - Date.now()); }

function toast(msg, kind = "") {
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.innerHTML = msg;
  $("status").appendChild(el);
  setTimeout(() => el.remove(), 6000);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: {
      "Authorization": "Bearer " + PW,
      "Content-Type": "application/json",
      ...(opts.headers || {}),
    },
  });
  if (res.status === 401) {
    sessionStorage.removeItem("gfm_pw");
    showLogin();
    throw new Error("Unauthorized");
  }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

function showLogin() {
  $("login").style.display = "flex";
  $("app").style.display = "none";
  updateLockoutUI();
}

async function showApp() {
  $("login").style.display = "none";
  $("app").style.display = "flex";
  await loadTree();
}

async function loadTree() {
  const data = await api("/api/tree");
  tree = data.files;
  $("repoName").textContent = data.branch ? (location.hostname) : "";
  $("branchName").textContent = data.branch;
  renderTree();
}

function renderTree() {
  const filter = $("search").value.trim().toLowerCase();
  const list = $("treeList");
  list.innerHTML = "";
  const visible = tree.filter((f) => !staged.del.has(f.path) && f.path.toLowerCase().includes(filter));
  if (visible.length === 0) {
    list.innerHTML = '<div class="empty">কোনো ফাইল নেই</div>';
    return;
  }
  for (const f of visible) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <input type="checkbox" data-path="${escapeAttr(f.path)}" class="sel" />
      <span class="path">${escapeHtml(f.path)}</span>
      <span class="size">${formatSize(f.size)}</span>
      <span class="rename-btn" data-path="${escapeAttr(f.path)}">rename</span>
    `;
    list.appendChild(row);
  }
  list.querySelectorAll(".rename-btn").forEach((el) => {
    el.addEventListener("click", () => startRename(el.dataset.path));
  });
}

function startRename(oldPath) {
  const row = [...document.querySelectorAll(".row")].find(
    (r) => r.querySelector(".rename-btn")?.dataset.path === oldPath
  );
  if (!row) return;
  const pathSpan = row.querySelector(".path");
  const input = document.createElement("input");
  input.type = "text";
  input.className = "rename";
  input.value = oldPath;
  pathSpan.replaceWith(input);
  input.focus();
  input.select();
  const commit = () => {
    const newPath = input.value.trim();
    if (newPath && newPath !== oldPath) {
      const f = tree.find((x) => x.path === oldPath);
      stageDelete(oldPath);
      stageAdd(newPath, { sha: f.sha });
      toast(`রিনেম স্টেজ হয়েছে: <b>${escapeHtml(oldPath)}</b> → <b>${escapeHtml(newPath)}</b>`);
    }
    renderTree();
  };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") commit();
    if (e.key === "Escape") renderTree();
  });
  input.addEventListener("blur", commit);
}

function stageAdd(path, entry) {
  staged.del.delete(path);
  staged.add.set(path, entry);
  renderStage();
}
function stageDelete(path) {
  staged.add.delete(path);
  staged.del.add(path);
  renderStage();
}
function unstage(path, type) {
  if (type === "add") staged.add.delete(path);
  else staged.del.delete(path);
  renderStage();
  renderTree();
}

function renderStage() {
  const list = $("stageList");
  const entries = [
    ...[...staged.del].map((path) => ({ path, type: "del" })),
    ...[...staged.add.keys()].map((path) => ({ path, type: "add" })),
  ].sort((a, b) => a.path.localeCompare(b.path));
  if (entries.length === 0) {
    list.innerHTML = '<div class="empty">কিছু এখনো স্টেজ করা হয়নি</div>';
    return;
  }
  list.innerHTML = "";
  for (const e of entries) {
    const row = document.createElement("div");
    row.className = "diffRow " + e.type;
    row.innerHTML = `
      <span class="mark">${e.type === "add" ? "+" : "−"}</span>
      <span class="path">${escapeHtml(e.path)}</span>
      <span class="remove" data-path="${escapeAttr(e.path)}" data-type="${e.type}">✕</span>
    `;
    list.appendChild(row);
  }
  list.querySelectorAll(".remove").forEach((el) => {
    el.addEventListener("click", () => unstage(el.dataset.path, el.dataset.type));
  });
}

$("deleteSelectedBtn").addEventListener("click", () => {
  const checked = [...document.querySelectorAll(".sel:checked")].map((el) => el.dataset.path);
  if (checked.length === 0) return toast("আগে কিছু ফাইল সিলেক্ট করো");
  checked.forEach(stageDelete);
  renderTree();
});

// --- zip / file drop -> extract client-side -> stage as additions ---
const dz = $("dropzone");
dz.addEventListener("click", () => $("fileInput").click());
["dragenter", "dragover"].forEach((ev) =>
  dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add("drag"); })
);
["dragleave", "drop"].forEach((ev) =>
  dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove("drag"); })
);
dz.addEventListener("drop", (e) => handleFiles(e.dataTransfer.files));
$("fileInput").addEventListener("change", (e) => handleFiles(e.target.files));

async function handleFiles(fileList) {
  for (const file of fileList) {
    if (file.name.toLowerCase().endsWith(".zip")) {
      await handleZip(file);
    } else {
      const buf = new Uint8Array(await file.arrayBuffer());
      stageAdd(file.name, { content: bytesToBase64(buf), encoding: "base64" });
      toast(`স্টেজ হয়েছে: <b>${escapeHtml(file.name)}</b>`);
    }
  }
}

async function handleZip(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  let unzipped;
  try {
    unzipped = unzipSync(buf);
  } catch (err) {
    return toast("Zip এক্সট্র্যাক্ট করা যায়নি: " + err.message, "err");
  }
  const entries = Object.entries(unzipped).filter(([path, data]) => !path.endsWith("/") && data.length >= 0);
  if (entries.length === 0) return toast("Zip-এ কোনো ফাইল পাওয়া যায়নি", "err");
  for (const [path, data] of entries) {
    stageAdd(path, { content: bytesToBase64(data), encoding: "base64" });
  }
  toast(`Zip থেকে <b>${entries.length}</b>টা ফাইল স্টেজ হয়েছে`);
}

function bytesToBase64(bytes) {
  let binary = "";
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}

$("commitBtn").addEventListener("click", async () => {
  const additions = [...staged.add.entries()].map(([path, v]) => ({ path, ...v }));
  const deletions = [...staged.del];
  if (additions.length === 0 && deletions.length === 0) return toast("কিছু স্টেজ করা নেই");
  const message = $("commitMsg").value.trim() || `Update ${additions.length} file(s), delete ${deletions.length} file(s)`;
  $("commitBtn").disabled = true;
  try {
    const result = await api("/api/commit", {
      method: "POST",
      body: JSON.stringify({ message, additions, deletions }),
    });
    toast(`কমিট হয়ে গেছে: <a href="${result.url}" target="_blank">${result.commitSha.slice(0, 7)}</a>`, "ok");
    staged = { add: new Map(), del: new Set() };
    $("commitMsg").value = "";
    renderStage();
    await loadTree();
  } catch (err) {
    toast("কমিট ব্যর্থ: " + err.message, "err");
  } finally {
    $("commitBtn").disabled = false;
  }
});

$("search").addEventListener("input", renderTree);

$("loginBtn").addEventListener("click", doLogin);
$("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });

let lockTimer = null;
function updateLockoutUI() {
  const remaining = lockRemainingMs();
  const box = $("loginLockout");
  const btn = $("loginBtn");
  const input = $("pw");
  clearInterval(lockTimer);
  if (remaining <= 0) {
    box.style.display = "none";
    btn.disabled = false;
    input.disabled = false;
    return;
  }
  btn.disabled = true;
  input.disabled = true;
  box.style.display = "block";
  const tick = () => {
    const ms = lockRemainingMs();
    if (ms <= 0) { updateLockoutUI(); return; }
    box.textContent = `অনেকবার ভুল পাসওয়ার্ড দেওয়া হয়েছে — ${Math.ceil(ms / 1000)} সেকেন্ড পর আবার চেষ্টা করো`;
  };
  tick();
  lockTimer = setInterval(tick, 1000);
}

async function doLogin() {
  if (lockRemainingMs() > 0) return;
  const pw = $("pw").value;
  if (!pw) return;
  PW = pw;
  $("loginBtn").disabled = true;
  try {
    await api("/api/tree");
    sessionStorage.setItem("gfm_pw", pw);
    clearLockState();
    $("loginErr").textContent = "";
    await showApp();
  } catch (err) {
    registerFailedAttempt();
    $("loginErr").textContent = "পাসওয়ার্ড ভুল, বা রেপো/টোকেন কনফিগার করা নেই।";
    updateLockoutUI();
  } finally {
    if (lockRemainingMs() <= 0) $("loginBtn").disabled = false;
  }
}

$("logoutBtn").addEventListener("click", () => {
  sessionStorage.removeItem("gfm_pw");
  PW = "";
  showLogin();
});

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }
function formatSize(n) {
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  return (n / (1024 * 1024)).toFixed(1) + " MB";
}

updateLockoutUI();
if (PW && lockRemainingMs() <= 0) showApp().catch(() => showLogin());
else showLogin();
</script>
</body>
</html>
